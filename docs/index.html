<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Walls</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Walls</h1>
    <nav class="tabs">
      <button class="tab-btn active" data-view="gallery">Gallery</button>
      <button class="tab-btn" data-view="map">Map</button>
      <button class="tab-btn" data-view="collections">Collections</button>
    </nav>
  </header>

  <main>
    <section id="view-gallery" class="view active">
      <div class="filter-bar" id="gallery-filter" hidden>
        <span id="gallery-filter-label"></span>
        <button id="gallery-filter-clear">Clear filter ✕</button>
      </div>
      <div id="gallery-grid" class="grid"></div>
    </section>

    <section id="view-map" class="view">
      <div id="map"></div>
    </section>

    <section id="view-collections" class="view">
      <div id="collections-grid" class="grid collections-grid"></div>
    </section>
  </main>

  <div id="lightbox" class="lightbox" hidden>
    <button id="lightbox-close" class="lightbox-close">✕</button>
    <div class="lightbox-content">
      <img id="lightbox-img" src="" alt="" />
      <div class="lightbox-meta">
        <p id="lightbox-desc"></p>
        <p id="lightbox-date" class="muted"></p>
        <div id="lightbox-collections" class="chip-row"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
